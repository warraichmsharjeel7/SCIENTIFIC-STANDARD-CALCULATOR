<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Scientific & Standard Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-cyber min-h-screen flex items-center justify-center p-4 transition-colors duration-500">

    <!-- Background Animated Glow Elements -->
    <div class="absolute w-72 h-72 rounded-full bg-indigo-500/20 blur-3xl -top-10 -left-10 pointer-events-none animate-pulse"></div>
    <div class="absolute w-72 h-72 rounded-full bg-purple-500/20 blur-3xl -bottom-10 -right-10 pointer-events-none animate-pulse"></div>

    <div class="glass-container w-full max-w-[390px] sm:max-w-[430px] rounded-3xl p-5 sm:p-6 text-white flex flex-col gap-4 relative z-10 shadow-2xl">
        
        <!-- Header: Mode Switcher & Theme Selector -->
        <div class="flex items-center justify-between border-b border-white/10 pb-3">
            <div class="flex bg-black/40 p-1 rounded-xl border border-white/10 text-xs font-medium">
                <button id="mode-std" onclick="switchMode('std')" class="px-3 py-1.5 rounded-lg transition-all duration-200 bg-indigo-600 text-white shadow-md">
                    Standard
                </button>
                <button id="mode-sci" onclick="switchMode('sci')" class="px-3 py-1.5 rounded-lg transition-all duration-200 text-slate-300 hover:text-white">
                    Scientific
                </button>
            </div>
            
            <div class="flex items-center gap-2">
                <!-- Theme Changer Dropdown / Button -->
                <select id="theme-selector" onchange="changeTheme(this.value)" class="bg-black/50 border border-white/10 text-xs rounded-lg px-2 py-1.5 text-slate-200 focus:outline-none cursor-pointer">
                    <option value="cyber">Cyberpunk</option>
                    <option value="neon">Dark Neon</option>
                    <option value="emerald">Emerald Glow</option>
                    <option value="sunset">Sunset Dusk</option>
                </select>

                <!-- Angle Mode Toggle (Deg/Rad) -->
                <button id="deg-rad-btn" onclick="toggleDegRad()" class="hidden text-xs font-semibold px-2 py-1.5 bg-black/40 border border-white/10 rounded-lg text-amber-400 hover:bg-white/10 transition">
                    DEG
                </button>
            </div>
        </div>

        <!-- Display Area -->
        <div class="display-box rounded-2xl p-4 flex flex-col justify-between min-h-[120px] shadow-inner relative overflow-hidden">
            <!-- Equation History Line -->
            <div id="history-display" class="display-font text-right text-xs sm:text-sm text-indigo-300/80 overflow-x-auto whitespace-nowrap custom-scroll min-h-[20px]">
                0
            </div>
            <!-- Current Output / Main Line -->
            <div id="main-display" class="display-font text-right text-2xl sm:text-4xl font-bold tracking-wider text-white overflow-x-auto whitespace-nowrap custom-scroll mt-2">
                0
            </div>
        </div>

        <!-- Keypad Grid Container -->
        <div class="flex flex-col gap-2.5">
            
            <!-- Scientific Secondary Row Keys (Shown only in Scientific Mode) -->
            <div id="sci-keys-extra" class="hidden grid-cols-5 gap-2 transition-all duration-300">
                <button onclick="appendFunc('sin')" class="calc-btn btn-sci rounded-xl py-2 text-xs font-semibold">sin</button>
                <button onclick="appendFunc('cos')" class="calc-btn btn-sci rounded-xl py-2 text-xs font-semibold">cos</button>
                <button onclick="appendFunc('tan')" class="calc-btn btn-sci rounded-xl py-2 text-xs font-semibold">tan</button>
                <button onclick="appendFunc('log')" class="calc-btn btn-sci rounded-xl py-2 text-xs font-semibold">log</button>
                <button onclick="appendFunc('ln')" class="calc-btn btn-sci rounded-xl py-2 text-xs font-semibold">ln</button>

                <button onclick="appendValue('(')" class="calc-btn btn-sci rounded-xl py-2 text-xs font-semibold">(</button>
                <button onclick="appendValue(')')" class="calc-btn btn-sci rounded-xl py-2 text-xs font-semibold">)</button>
                <button onclick="appendValue('^')" class="calc-btn btn-sci rounded-xl py-2 text-xs font-semibold">x^y</button>
                <button onclick="appendFunc('sqrt')" class="calc-btn btn-sci rounded-xl py-2 text-xs font-semibold">√</button>
                <button onclick="appendValue('!')" class="calc-btn btn-sci rounded-xl py-2 text-xs font-semibold">n!</button>

                <button onclick="appendValue('π')" class="calc-btn btn-sci rounded-xl py-2 text-xs font-semibold text-amber-300">π</button>
                <button onclick="appendValue('e')" class="calc-btn btn-sci rounded-xl py-2 text-xs font-semibold text-amber-300">e</button>
                <button onclick="appendFunc('sq')" class="calc-btn btn-sci rounded-xl py-2 text-xs font-semibold">x²</button>
                <button onclick="appendFunc('inv')" class="calc-btn btn-sci rounded-xl py-2 text-xs font-semibold">1/x</button>
                <button onclick="appendOperator('%')" class="calc-btn btn-sci rounded-xl py-2 text-xs font-semibold">%</button>
            </div>

            <!-- Standard Main Keypad Grid -->
            <div class="grid grid-cols-4 gap-2.5">
                <!-- Row 1 -->
                <button onclick="clearAll()" class="calc-btn btn-ac font-semibold rounded-2xl py-3 text-sm">AC</button>
                <button onclick="backspace()" class="calc-btn btn-util font-semibold rounded-2xl py-3 text-sm">
                    <i class="fa-solid fa-backspace"></i>
                </button>
                <button onclick="toggleSign()" class="calc-btn btn-util font-semibold rounded-2xl py-3 text-sm">+/-</button>
                <button onclick="appendOperator('/')" class="calc-btn btn-op font-semibold rounded-2xl py-3 text-base">÷</button>

                <!-- Row 2 -->
                <button onclick="appendValue('7')" class="calc-btn btn-num font-medium rounded-2xl py-3.5 text-base">7</button>
                <button onclick="appendValue('8')" class="calc-btn btn-num font-medium rounded-2xl py-3.5 text-base">8</button>
                <button onclick="appendValue('9')" class="calc-btn btn-num font-medium rounded-2xl py-3.5 text-base">9</button>
                <button onclick="appendOperator('*')" class="calc-btn btn-op font-semibold rounded-2xl py-3.5 text-base">×</button>

                <!-- Row 3 -->
                <button onclick="appendValue('4')" class="calc-btn btn-num font-medium rounded-2xl py-3.5 text-base">4</button>
                <button onclick="appendValue('5')" class="calc-btn btn-num font-medium rounded-2xl py-3.5 text-base">5</button>
                <button onclick="appendValue('6')" class="calc-btn btn-num font-medium rounded-2xl py-3.5 text-base">6</button>
                <button onclick="appendOperator('-')" class="calc-btn btn-op font-semibold rounded-2xl py-3.5 text-base">−</button>

                <!-- Row 4 -->
                <button onclick="appendValue('1')" class="calc-btn btn-num font-medium rounded-2xl py-3.5 text-base">1</button>
                <button onclick="appendValue('2')" class="calc-btn btn-num font-medium rounded-2xl py-3.5 text-base">2</button>
                <button onclick="appendValue('3')" class="calc-btn btn-num font-medium rounded-2xl py-3.5 text-base">3</button>
                <button onclick="appendOperator('+')" class="calc-btn btn-op font-semibold rounded-2xl py-3.5 text-base">+</button>

                <!-- Row 5 -->
                <button onclick="appendValue('0')" class="calc-btn btn-num font-medium rounded-2xl py-3.5 text-base col-span-2">0</button>
                <button onclick="appendValue('.')" class="calc-btn btn-num font-medium rounded-2xl py-3.5 text-base">.</button>
                <button onclick="calculate()" class="calc-btn btn-eq font-bold rounded-2xl py-3.5 text-lg shadow-lg">=</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
